<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Padel App - Nueva dirección</title>
  <meta name="theme-color" content="#0090DF">
  <meta name="description" content="Padel App se ha trasladado a una nueva dirección.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon-192.png">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #F4F6F8;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #17202A;
      text-align: center;
    }
    .tarjeta {
      background: #FFFFFF;
      border-radius: 18px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
    }
    img.logo { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px; }
    h1 { font-size: 21px; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.6; color: #445; margin: 0 0 24px; }
    a.boton {
      display: block;
      background: #0090DF;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 16px;
      border-radius: 12px;
    }
    a.boton:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <img class="logo" src="assets/icon-192.png" alt="">
    <h1>Esta app se ha trasladado</h1>
    <p>Padel App ya no está aquí. A partir de ahora, usa esta nueva dirección para entrar (guárdala en tus marcadores):</p>
    <a class="boton" href="https://elmoral-cloudflare.humanes80.workers.dev/">Ir a la nueva Padel App</a>
  </div>
</body>
</html>
